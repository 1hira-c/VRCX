name: VRCX Web
version: "0.1.0"
slug: vrcx_web
description: Original VRCX running 24/7 as a hidden worker, served to your browser over HTTPS.
url: https://github.com/1hira-c/VRCX/tree/codex/vrcx-web-native/home-assistant/vrcx
arch:
  - aarch64
  - amd64
image: ghcr.io/1hira-c/vrcx-ha-addon-{arch}
startup: application
boot: auto
init: true
# The ASP.NET server waits up to 25 s for the Electron worker process group to exit.
timeout: 40
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: VRCX Web (HTTPS)
webui: https://[HOST]:[PORT:8443]/
watchdog: tcp://[HOST]:[PORT:8443]
map:
  - type: ssl
  - type: share
    read_only: false
# SQLite and the Electron profile are only consistent while the add-on is stopped.
backup: cold
backup_exclude:
  - runtime/xdg-cache
  - runtime/home/.cache
  - import-staging
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  hostnames:
    - homeassistant.local
  export_ca: true
schema:
  ssl: bool
  certfile: str
  keyfile: str
  hostnames:
    - match(^[A-Za-z0-9][A-Za-z0-9.-]*$)
  export_ca: bool
